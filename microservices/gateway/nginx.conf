server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /static/ { alias /usr/share/nginx/html/; }
 location /api/products { proxy_pass http://product-service:8000/api/products; }
 location /api/orders { proxy_pass http://order-service:8000/api/orders; }
 location /api/users { proxy_pass http://user-service:8000/api/users; }
 location /health/products { proxy_pass http://product-service:8000/health; }
 location /health/orders { proxy_pass http://order-service:8000/health; }
 location /health/users { proxy_pass http://user-service:8000/health; }
}
